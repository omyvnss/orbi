[package]
name = "orbi-hook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tiny hook binary that connects AI coding agents to Orbi"
rust-version = "1.77"

[[bin]]
name = "orbi-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Server-authenticity proof (docs/APP.md): HMAC-SHA256 over the token.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
