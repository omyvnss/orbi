<!doctype html><meta charset="utf-8"><title>Orbi — logo concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist+Mono&display=swap">
<style>
body{margin:0;background:#02020a;color:#d9d9cd;font:14px "Geist Mono",monospace;padding:40px}
h1{font:600 34px "Bricolage Grotesque";letter-spacing:-.03em;margin:0 0 24px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c{border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair div{aspect-ratio:1;display:grid;place-items:center}
.sage{background:#d3d4c2}.dark{background:#0b0c10}
.pair img{width:72%}.dark img{filter:invert(1) hue-rotate(180deg) brightness(.95)}
.sizes{display:flex;gap:14px;align-items:center;padding:12px 16px;background:#e9e9ec}
.sizes img:nth-child(1){width:16px}.sizes img:nth-child(2){width:32px}.sizes img:nth-child(3){width:64px}
.l{padding:10px 16px}.l b{color:#fff;font-weight:500}
</style>
<h1>Orbi — six directions</h1>
<div class="grid" id="g"></div>
<script>
const C=[["a-island","A · Island","The face itself — reads at 16 px."],["b-orbit","B · Orbit","The face with a ring and one moon."],["c-notch","C · Notch","Hangs from the top of the screen."],["d-o","D · O","The letter as a ring, eyes inside."],["e-matrix","E · Matrix","Built from dots, gold eyes."],["f-eclipse","F · Eclipse","An orb with a warm crescent."]];
g.innerHTML=C.map(([f,t,d])=>`<div class="c"><div class="pair"><div class="sage"><img src="concepts/${f}.svg"></div><div class="dark"><img src="concepts/${f}.svg"></div></div><div class="sizes"><img src="concepts/${f}.svg"><img src="concepts/${f}.svg"><img src="concepts/${f}.svg"></div><p class="l"><b>${t}</b> — ${d}</p></div>`).join("");
</script>
